name: Publish to PyPI

on:
  release:
    types: [published]  # Trigger only when a GitHub Release is published.

jobs:
  publish:
    if: github.repository == 'cognizant-ai-lab/nsflow'
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: pypi  # Match this to your configured GitHub Environment.
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing

    steps:
      # actions/checkout v6.0.2
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # cognizant-ai-lab/build-common 1.0.10 -- publish-pypi
      - name: Build and publish package
        uses: cognizant-ai-lab/build-common/actions/publish-pypi@cb254b1336a6a6034008eab4d5a94a9c034fa89c
        with:
          python-version: '3.10'

      # cognizant-ai-lab/build-common 1.0.10 -- slack-notify
      - name: Notify Slack
        if: ${{ !cancelled() }}
        uses: cognizant-ai-lab/build-common/actions/slack-notify@cb254b1336a6a6034008eab4d5a94a9c034fa89c
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
